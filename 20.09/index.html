<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <form>
        <select id="t1">Wybierz Kolor
            <option value="Red">Czerwony</option>
            <option value="Black">Czarny</option>
            <option value="Green">Zielony</option>
        </select>
        
        <select id="t2">Kształt
            <option value="circle">Koło</option>
            <option value="rect">Kwadrat</option>
        </select>
        <input id="t3" type="number" min="0" max="100" value="0"> Podaj Liczbe 
    </form>

    <button type="button" onclick="createShape();">accept</button>
</head>
<body>
</body>
</html>

<script>
var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("width", "500");
svg.setAttribute("height", "500");
svg.style.stroke = "black";
document.body.appendChild(svg);

var color, shape, amount;

document.getElementById("t1").addEventListener("change", change);
document.getElementById("t2").addEventListener("change", change);
document.getElementById("t3").addEventListener("change", change);

function change() {
    color = document.getElementById("t1").value;
    shape = document.getElementById("t2").value;
    amount = document.getElementById("t3").value;
}

function createShape() {
    var sh;
    switch(shape) {
        case "rect":
            sh = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            sh.setAttribute("x", 250 - amount / 2);
            sh.setAttribute("y", 250 - amount / 2);
            sh.setAttribute("height", amount);
            sh.setAttribute("width", amount);
            break;
        case "circle":
            sh = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            sh.setAttribute("cx", 250);
            sh.setAttribute("cy", 250);
            sh.setAttribute("r", amount);
            break;
    }
    sh.setAttribute("fill", color);
    svg.appendChild(sh);
}
</script>
